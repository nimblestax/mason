repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black --check src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run ruff check src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        always_run: true
        pass_filenames: false
