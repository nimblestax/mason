[project]
name = "mason-databricks"
version = "0.0.1"
description = "Bring the software development lifecycle to Databricks pipelines"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlglot==26.*",
    "typer>=0.27.3",
]

[project.scripts]
mason = "mason.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mason"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
